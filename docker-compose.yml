services:
  axelrod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axelrod
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - MODEL_ID=${MODEL_ID:-1HSGTNa48Ft3dgnhtDPufw321fphWf4kS}
      - SCALER_ID=${SCALER_ID:-1kPLWoJbFaU3jC3jSENalLo1dSRz25mjp}
    volumes:
      # Development mode: mount source code for live reload
      - ./main.py:/app/main.py
      - ./config.py:/app/config.py
      - ./schemas.py:/app/schemas.py
      - ./logger.py:/app/logger.py
      - ./model_loader.py:/app/model_loader.py
      - ./predict_service.py:/app/predict_service.py
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - axelrod-net

networks:
  axelrod-net:
    driver: bridge
