<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DepthIQ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0b1220;
color:white;
}

.sidebar{
position:fixed;
width:240px;
height:100vh;
background:#0f172a;
padding:20px;
}

.logo{
font-size:26px;
font-weight:800;
color:#00f5ff;
margin-bottom:30px;
}

.main{
margin-left:260px;
padding:20px;
}

.card{
background:#111827;
padding:15px;
border-radius:12px;
margin-bottom:15px;
border:1px solid #1f2937;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

input{
padding:10px;
border-radius:8px;
border:1px solid #1f2937;
background:#0b1220;
color:white;
}

button{
margin-top:10px;
padding:12px;
background:#00f5ff;
border:none;
font-weight:bold;
cursor:pointer;
}

.kpi{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.value{
color:#00f5ff;
font-size:22px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="sidebar">
<div class="logo">DEPTHIQ</div>
</div>

<div class="main">

<h2>Drilling Intelligence Dashboard</h2>

<!-- KPI -->
<div class="kpi">
<div class="card">Avg <div class="value" id="avg">--</div></div>
<div class="card">Cut <div class="value" id="cut">--</div></div>
<div class="card">Fast <div class="value" id="fast">--</div></div>
</div>

<!-- INPUT -->
<div class="card">

<div class="grid">
<input id="ad_rop_sp" placeholder="AD ROP SP">
<input id="ad_torque_sp" placeholder="Torque SP">
<input id="accum_trip_in" placeholder="Trip In">
<input id="datetime" type="datetime-local">
<input id="depth_of_cut" placeholder="Depth">
<input id="hook_load" placeholder="Hook Load">
<input id="total_gas" placeholder="Gas">
<input id="wc_bit_weight" placeholder="Bit Weight">
</div>

<button onclick="predict()">Predict</button>

</div>

<!-- ACTUAL VALUES -->
<div class="card">

<h3>Actual Values (Comparison)</h3>

<div class="grid">
<input id="actual_avg" placeholder="Actual Avg">
<input id="actual_cut" placeholder="Actual Cut">
<input id="actual_fast" placeholder="Actual Fast">
</div>

<button onclick="compare()">Compare Actual vs Predicted</button>

</div>

<!-- CHART -->
<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<script>

let last = [];
let chart;

/* =====================
   PREDICT
===================== */
async function predict(){

const data = {
ad_rop_sp:+ad_rop_sp.value,
ad_torque_sp:+ad_torque_sp.value,
accum_trip_in:+accum_trip_in.value,
datetime:new Date(datetime.value).getTime(),
depth_of_cut:+depth_of_cut.value,
hook_load:+hook_load.value,
total_gas:+total_gas.value,
wc_bit_weight:+wc_bit_weight.value
};

const res = await fetch("/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r = await res.json();

last = [r.ROP_Average,r.ROP_Cut_Unit,r.ROP_Fast];

avg.innerText = r.ROP_Average.toFixed(2);
cut.innerText = r.ROP_Cut_Unit.toFixed(2);
fast.innerText = r.ROP_Fast.toFixed(2);

drawChart(null);
}

/* =====================
   FIXED COMPARISON (NO SCATTER)
===================== */
function compare(){

const actual = [
+actual_avg.value || 0,
+actual_cut.value || 0,
+actual_fast.value || 0
];

drawChart(actual);
}

/* =====================
   PROFESSIONAL BAR COMPARISON
===================== */
function drawChart(actual){

if(chart) chart.destroy();

chart = new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["ROP Avg","ROP Cut","ROP Fast"],
datasets:[

{
label:"Predicted",
data:last,
backgroundColor:"#00f5ff"
},

...(actual ? [{
label:"Actual",
data:actual,
backgroundColor:"#f59e0b"
}] : [])

]
}
});
}

</script>

</body>
</html>
