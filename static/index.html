<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DepthIQ | Drilling Intelligence</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle, #0f172a, #020617);
    color: white;
}

/* GRID BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    height: 100vh;
    position: fixed;
    background: rgba(15,23,42,0.7);
    padding: 20px;
}

/* LOGO */
.logo {
    font-size: 22px;
    font-weight: bold;
    color: #00f5ff;
    margin-bottom: 20px;
}

/* MAIN */
.main {
    margin-left: 240px;
    padding: 20px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* INPUT */
input {
    padding: 8px;
    border-radius: 5px;
}

/* BUTTON */
button {
    padding: 10px;
    background: #00f5ff;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

canvas {
    margin-top: 20px;
}

</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">DEPTHIQ</div>
</div>

<div class="main">

<h1>DepthIQ Drilling Intelligence Dashboard</h1>

<div id="loading" style="color:yellow; display:none;">
    Model Loading...
</div>

<!-- INPUT -->
<div class="card">

<div class="grid">
<input id="ad_rop_sp" placeholder="AD ROP SP">
<input id="ad_torque_sp" placeholder="Torque SP">
<input id="accum_trip_in" placeholder="Trip In">
<input id="datetime" type="datetime-local">
<input id="depth_of_cut" placeholder="Depth of Cut">
<input id="hook_load" placeholder="Hook Load">
<input id="total_gas" placeholder="Gas">
<input id="wc_bit_weight" placeholder="Bit Weight">
</div>

<button onclick="predict()">Predict</button>
<button onclick="compare()">Compare</button>

</div>

<!-- OUTPUT -->
<div class="card">
<p id="avg">--</p>
<p id="cut">--</p>
<p id="fast">--</p>
</div>

<!-- CHARTS -->
<canvas id="barChart"></canvas>
<canvas id="scatterChart"></canvas>

</div>

<script>

let lastPrediction = [];
let barChart;
let scatterChart;

/* =====================
   HEALTH CHECK
===================== */
setInterval(async () => {
    const res = await fetch("/health");
    const data = await res.json();

    document.getElementById("loading").style.display =
        data.status === "loading" ? "block" : "none";
}, 3000);

/* =====================
   PREDICT
===================== */
async function predict() {

const data = {
ad_rop_sp:+ad_rop_sp.value,
ad_torque_sp:+ad_torque_sp.value,
accum_trip_in:+accum_trip_in.value,
datetime:new Date(datetime.value).getTime(),
depth_of_cut:+depth_of_cut.value,
hook_load:+hook_load.value,
total_gas:+total_gas.value,
wc_bit_weight:+wc_bit_weight.value
};

const res = await fetch("/predict", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r = await res.json();

lastPrediction = [r.ROP_Average, r.ROP_Cut_Unit, r.ROP_Fast];

avg.innerText = r.ROP_Average;
cut.innerText = r.ROP_Cut_Unit;
fast.innerText = r.ROP_Fast;

drawBar(lastPrediction);
}

/* =====================
   COMPARE
===================== */
function compare(){

const actual = [
+prompt("Actual Avg"),
+prompt("Actual Cut"),
+prompt("Actual Fast")
];

drawScatter(actual, lastPrediction);
}

/* =====================
   BAR CHART
===================== */
function drawBar(pred){

if(barChart) barChart.destroy();

barChart = new Chart(barChartCanvas, {
type:"bar",
data:{
labels:["Avg","Cut","Fast"],
datasets:[{
label:"Predicted",
data:pred,
backgroundColor:"#00f5ff"
}]
}
});
}

/* =====================
   SCATTER
===================== */
function drawScatter(actual, pred){

if(scatterChart) scatterChart.destroy();

scatterChart = new Chart(scatterChartCanvas, {
type:"scatter",
data:{
datasets:[{
label:"Actual vs Predicted",
data:[
{x:actual[0],y:pred[0]},
{x:actual[1],y:pred[1]},
{x:actual[2],y:pred[2]}
],
pointRadius:8
}]
}
});
}

</script>

</body>
</html>
