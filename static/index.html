<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DepthIQ | Drilling Intelligence</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #020617, #000);
    color: white;
}

/* GRID BACKGROUND */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: move 20s linear infinite;
    pointer-events: none;
}

@keyframes move {
    0% { transform: translateY(0); }
    100% { transform: translateY(50px); }
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    height: 100vh;
    position: fixed;
    background: rgba(2,6,23,0.85);
    padding: 20px;
    border-right: 1px solid rgba(0,255,255,0.1);
}

/* LOGO */
.logo {
    font-size: 28px;
    font-weight: 900;
    color: #00f5ff;
    text-shadow: 0 0 20px #00f5ff;
    margin-bottom: 30px;
}

/* MAIN */
.main {
    margin-left: 260px;
    padding: 25px;
}

/* CARDS */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0,255,255,0.1);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* INPUT */
input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #0b1220;
    color: white;
}

/* BUTTON */
button {
    margin-top: 10px;
    padding: 12px;
    background: linear-gradient(90deg,#00f5ff,#3b82f6);
    border: none;
    font-weight: bold;
    cursor: pointer;
}

/* KPI */
.kpi {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.value {
    color: #00f5ff;
    font-size: 22px;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="sidebar">
<div class="logo">DEPTHIQ</div>
</div>

<div class="main">

<h2>Drilling Intelligence Dashboard</h2>

<!-- KPI -->
<div class="kpi">
<div class="card">Avg <div class="value" id="avg">--</div></div>
<div class="card">Cut <div class="value" id="cut">--</div></div>
<div class="card">Fast <div class="value" id="fast">--</div></div>
</div>

<!-- INPUT -->
<div class="card">
<div class="grid">
<input id="ad_rop_sp" placeholder="AD ROP SP">
<input id="ad_torque_sp" placeholder="Torque SP">
<input id="accum_trip_in" placeholder="Trip In">
<input id="datetime" type="datetime-local">
<input id="depth_of_cut" placeholder="Depth">
<input id="hook_load" placeholder="Hook Load">
<input id="total_gas" placeholder="Gas">
<input id="wc_bit_weight" placeholder="Bit Weight">
</div>

<button onclick="predict()">Predict</button>
</div>

<!-- ACTUAL -->
<div class="card">
<div class="grid">
<input id="actual_avg" placeholder="Actual Avg">
<input id="actual_cut" placeholder="Actual Cut">
<input id="actual_fast" placeholder="Actual Fast">
</div>

<button onclick="compare()">Compare</button>
</div>

<!-- CHARTS -->
<div class="card">
<canvas id="bar"></canvas>
</div>

<div class="card">
<canvas id="scatter"></canvas>
</div>

</div>

<script>

let last = [];
let bar, scatter;

/* PREDICT */
async function predict(){

const data = {
ad_rop_sp:+ad_rop_sp.value,
ad_torque_sp:+ad_torque_sp.value,
accum_trip_in:+accum_trip_in.value,
datetime:new Date(datetime.value).getTime(),
depth_of_cut:+depth_of_cut.value,
hook_load:+hook_load.value,
total_gas:+total_gas.value,
wc_bit_weight:+wc_bit_weight.value
};

const res = await fetch("/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r = await res.json();

last = [r.ROP_Average,r.ROP_Cut_Unit,r.ROP_Fast];

avg.innerText = r.ROP_Average.toFixed(2);
cut.innerText = r.ROP_Cut_Unit.toFixed(2);
fast.innerText = r.ROP_Fast.toFixed(2);

/* BAR */
if(bar) bar.destroy();
bar = new Chart(document.getElementById("bar"),{
type:"bar",
data:{
labels:["Avg","Cut","Fast"],
datasets:[{data:last,backgroundColor:"#00f5ff"}]
}
});
}

/* COMPARE */
function compare(){

const actual = [
+actual_avg.value,
+actual_cut.value,
+actual_fast.value
];

if(scatter) scatter.destroy();

scatter = new Chart(document.getElementById("scatter"),{
type:"scatter",
data:{
datasets:[{
label:"Actual vs Predicted",
data:[
{x:actual[0],y:last[0]},
{x:actual[1],y:last[1]},
{x:actual[2],y:last[2]}
],
pointRadius:8
}]
}
});
}

</script>

</body>
</html>
