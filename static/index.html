<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALPHA Drilling Intelligence</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #0b1220;
        color: white;
        display: flex;
    }

    /* SIDEBAR */
    .sidebar {
        width: 220px;
        background: #0f172a;
        padding: 20px;
        height: 100vh;
        position: fixed;
    }

    .logo {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 30px;
        color: #38bdf8;
    }

    .nav {
        display: flex;
        flex-direction: column;
        gap: 15px;
        font-size: 14px;
        color: #94a3b8;
    }

    .nav div:hover {
        color: white;
        cursor: pointer;
    }

    /* MAIN */
    .main {
        margin-left: 240px;
        padding: 20px;
        width: 100%;
    }

    /* TOP BAR */
    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .status {
        padding: 6px 12px;
        border-radius: 20px;
        background: #16a34a;
        font-size: 12px;
    }

    /* CARDS */
    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 20px;
    }

    .card {
        background: #111827;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #1f2937;
    }

    .card h3 {
        margin: 0;
        color: #38bdf8;
        font-size: 14px;
    }

    .value {
        font-size: 22px;
        margin-top: 8px;
    }

    /* INPUT SECTION */
    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    input {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #1f2937;
        background: #0b1220;
        color: white;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    canvas {
        margin-top: 20px;
        background: #0b1220;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #1f2937;
    }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">⚡ ALPHA AI</div>
    <div class="nav">
        <div>Dashboard</div>
        <div>Prediction</div>
        <div>Analytics</div>
        <div>Reports</div>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- TOP -->
    <div class="topbar">
        <h2>Drilling Intelligence Dashboard</h2>
        <div class="status">● API Online</div>
    </div>

    <!-- KPI CARDS -->
    <div class="cards">
        <div class="card">
            <h3>ROP Average</h3>
            <div class="value" id="avg">--</div>
        </div>

        <div class="card">
            <h3>ROP Cut Unit</h3>
            <div class="value" id="cut">--</div>
        </div>

        <div class="card">
            <h3>ROP Fast</h3>
            <div class="value" id="fast">--</div>
        </div>
    </div>

    <!-- INPUT -->
    <div class="card">
        <h3>Input Parameters</h3>

        <div class="grid">
            <input id="ad_rop_sp" placeholder="AD ROP SP">
            <input id="ad_torque_sp" placeholder="Torque SP">
            <input id="accum_trip_in" placeholder="Trip In">
            <input id="datetime" type="datetime-local">
            <input id="depth_of_cut" placeholder="Depth of Cut">
            <input id="hook_load" placeholder="Hook Load">
            <input id="total_gas" placeholder="Total Gas">
            <input id="wc_bit_weight" placeholder="Bit Weight">
        </div>

        <button onclick="predict()">Run Prediction</button>
    </div>

    <!-- CHART -->
    <canvas id="chart"></canvas>

</div>

<script>
let chart;

async function predict() {

    const data = {
        ad_rop_sp: +document.getElementById("ad_rop_sp").value,
        ad_torque_sp: +document.getElementById("ad_torque_sp").value,
        accum_trip_in: +document.getElementById("accum_trip_in").value,
        datetime: new Date(document.getElementById("datetime").value).getTime(),
        depth_of_cut: +document.getElementById("depth_of_cut").value,
        hook_load: +document.getElementById("hook_load").value,
        total_gas: +document.getElementById("total_gas").value,
        wc_bit_weight: +document.getElementById("wc_bit_weight").value
    };

    const res = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    const r = await res.json();

    const values = [
        r.ROP_Average,
        r.ROP_Cut_Unit,
        r.ROP_Fast
    ];

    // update KPI cards
    document.getElementById("avg").innerText = r.ROP_Average.toFixed(2);
    document.getElementById("cut").innerText = r.ROP_Cut_Unit.toFixed(2);
    document.getElementById("fast").innerText = r.ROP_Fast.toFixed(2);

    // chart
    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: ["Average", "Cut Unit", "Fast"],
            datasets: [{
                label: "ROP Prediction",
                data: values,
                borderColor: "#38bdf8",
                backgroundColor: "rgba(56,189,248,0.2)",
                fill: true,
                tension: 0.4
            }]
        }
    });
}
</script>

</body>
</html>
