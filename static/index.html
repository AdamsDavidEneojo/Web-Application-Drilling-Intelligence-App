<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALPHA ROP Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
    }

    /* HEADER */
    .header {
        text-align: center;
        padding: 25px;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .sub {
        text-align: center;
        margin-top: -10px;
        color: #94a3b8;
        font-size: 14px;
    }

    /* CONTAINER */
    .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 20px;
    }

    .card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 20px;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        margin-bottom: 20px;
    }

    h3 {
        margin-bottom: 10px;
        color: #38bdf8;
    }

    /* INPUT GRID */
    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    input {
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.08);
        color: white;
    }

    input::placeholder {
        color: #cbd5e1;
    }

    /* BUTTON */
    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.02);
    }

    /* CHART */
    canvas {
        margin-top: 20px;
        background: rgba(255,255,255,0.03);
        padding: 10px;
        border-radius: 10px;
    }

    /* FOOTER */
    .footer {
        text-align: center;
        font-size: 12px;
        color: #94a3b8;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="header">🚀 ALPHA ROP AI DASHBOARD</div>
<div class="sub">Machine Learning Rate of Penetration Prediction System</div>

<div class="container">

    <!-- INPUTS -->
    <div class="card">
        <h3>📥 Drilling Parameters</h3>

        <div class="grid">
            <input id="ad_rop_sp" placeholder="AD ROP SP">
            <input id="ad_torque_sp" placeholder="AD Torque SP">
            <input id="accum_trip_in" placeholder="Accum Trip In">
            <input id="datetime" type="datetime-local">
            <input id="depth_of_cut" placeholder="Depth of Cut">
            <input id="hook_load" placeholder="Hook Load">
            <input id="total_gas" placeholder="Total Gas">
            <input id="wc_bit_weight" placeholder="Bit Weight">
        </div>

        <button onclick="predict()">🔮 Predict ROP</button>
    </div>

    <!-- OPTIONAL ACTUAL -->
    <div class="card">
        <h3>📊 Actual Values (Optional)</h3>

        <div class="grid">
            <input id="actual_avg" placeholder="Actual ROP Avg">
            <input id="actual_cut" placeholder="Actual ROP Cut">
            <input id="actual_fast" placeholder="Actual ROP Fast">
        </div>
    </div>

    <!-- CHART -->
    <div class="card">
        <h3>📈 Prediction Results</h3>
        <canvas id="chart"></canvas>
    </div>

    <div class="footer">
        Built for Petroleum Engineering • ML + FastAPI + Render
    </div>

</div>

<script>
let chart;

async function predict() {

    const dateValue = document.getElementById("datetime").value;
    const datetimeNumber = dateValue ? new Date(dateValue).getTime() : 0;

    const data = {
        ad_rop_sp: parseFloat(document.getElementById("ad_rop_sp").value),
        ad_torque_sp: parseFloat(document.getElementById("ad_torque_sp").value),
        accum_trip_in: parseFloat(document.getElementById("accum_trip_in").value),
        datetime: datetimeNumber,
        depth_of_cut: parseFloat(document.getElementById("depth_of_cut").value),
        hook_load: parseFloat(document.getElementById("hook_load").value),
        total_gas: parseFloat(document.getElementById("total_gas").value),
        wc_bit_weight: parseFloat(document.getElementById("wc_bit_weight").value)
    };

    const response = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    const result = await response.json();

    const predicted = [
        result.ROP_Average,
        result.ROP_Cut_Unit,
        result.ROP_Fast
    ];

    const actual = [
        parseFloat(document.getElementById("actual_avg").value) || 0,
        parseFloat(document.getElementById("actual_cut").value) || 0,
        parseFloat(document.getElementById("actual_fast").value) || 0
    ];

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: "bar",
        data: {
            labels: ["ROP Average", "ROP Cut Unit", "ROP Fast"],
            datasets: [
                {
                    label: "Predicted",
                    data: predicted,
                    backgroundColor: "#38bdf8"
                },
                {
                    label: "Actual",
                    data: actual,
                    backgroundColor: "#f59e0b"
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: "white" } }
            },
            scales: {
                x: { ticks: { color: "white" } },
                y: { ticks: { color: "white" } }
            }
        }
    });
}
</script>

</body>
</html>
