<!DOCTYPE html>
<html>

<head>
<title>DepthIQ | AI Drilling Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ====== BACKGROUND ====== */
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle, #0f172a, #020617);
    color: white;
}

/* GRID ANIMATION */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    height: 100vh;
    position: fixed;
    background: rgba(15,23,42,0.7);
    padding: 20px;
}

/* LOGO */
.logo {
    font-size: 22px;
    font-weight: bold;
    color: #00f5ff;
}

/* MAIN */
.main {
    margin-left: 240px;
    padding: 20px;
}

/* CARDS */
.card {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
}

/* BUTTON */
button {
    padding: 10px;
    background: #00f5ff;
    border: none;
    cursor: pointer;
}

/* INPUT GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

input {
    padding: 8px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">DEPTHIQ</div>
</div>

<!-- MAIN -->
<div class="main">

<h1>DepthIQ Dashboard</h1>

<!-- KPI -->
<div class="card">
    <h3>Predictions</h3>
    <p id="avg">--</p>
    <p id="cut">--</p>
    <p id="fast">--</p>
</div>

<!-- INPUTS -->
<div class="card">

<div class="grid">
<input id="ad_rop_sp" placeholder="AD ROP SP">
<input id="ad_torque_sp" placeholder="Torque">
<input id="accum_trip_in" placeholder="Trip In">
<input id="datetime" type="datetime-local">
<input id="depth_of_cut" placeholder="Depth Cut">
<input id="hook_load" placeholder="Hook Load">
<input id="total_gas" placeholder="Gas">
<input id="wc_bit_weight" placeholder="Bit Weight">
</div>

<button onclick="predict()">Predict</button>
<button onclick="compare()">Compare</button>

</div>

<!-- CHARTS -->
<canvas id="chart"></canvas>
<canvas id="scatter"></canvas>

</div>

<script>

let lastPrediction = [];
let chart;
let scatter;

async function predict() {

const data = {
ad_rop_sp:+ad_rop_sp.value,
ad_torque_sp:+ad_torque_sp.value,
accum_trip_in:+accum_trip_in.value,
datetime:new Date(datetime.value).getTime(),
depth_of_cut:+depth_of_cut.value,
hook_load:+hook_load.value,
total_gas:+total_gas.value,
wc_bit_weight:+wc_bit_weight.value
};

const res = await fetch("/api/v1/predict", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r = await res.json();

lastPrediction = [r.ROP_Average, r.ROP_Cut_Unit, r.ROP_Fast];

avg.innerText = r.ROP_Average;
cut.innerText = r.ROP_Cut_Unit;
fast.innerText = r.ROP_Fast;

drawBar(lastPrediction);
}

function compare(){

const actual = [
+prompt("Actual Avg"),
+prompt("Actual Cut"),
+prompt("Actual Fast")
];

drawScatter(actual, lastPrediction);
}

function drawBar(pred){

if(chart) chart.destroy();

chart = new Chart(chartCanvas, {
type:"bar",
data:{
labels:["Avg","Cut","Fast"],
datasets:[{
label:"Predicted",
data:pred,
backgroundColor:"#00f5ff"
}]
}
});
}

function drawScatter(actual, pred){

if(scatter) scatter.destroy();

scatter = new Chart(scatterCanvas, {
type:"scatter",
data:{
datasets:[{
label:"Actual vs Predicted",
data:[
{x:actual[0],y:pred[0]},
{x:actual[1],y:pred[1]},
{x:actual[2],y:pred[2]}
],
pointRadius:8
}]
}
});
}

</script>

</body>
</html>
