<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DepthIQ | Drilling Intelligence Platform</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================
   BACKGROUND (CONTROL ROOM)
========================= */

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #020617, #000000);
    color: #e5e7eb;
    overflow-x: hidden;
}

/* Animated grid + glow */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
}

@keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(50px); }
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 260px;
    height: 100vh;
    position: fixed;
    background: rgba(2,6,23,0.8);
    border-right: 1px solid rgba(0,255,255,0.1);
    padding: 20px;
    backdrop-filter: blur(20px);
}

/* =========================
   LOGO (FUTURISTIC)
========================= */

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #00f5ff;
    text-shadow:
        0 0 10px #00f5ff,
        0 0 20px #00f5ff,
        0 0 40px #00f5ff;
    margin-bottom: 40px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #00f5ff; }
    to { text-shadow: 0 0 25px #00f5ff, 0 0 50px #00f5ff; }
}

/* NAV */
.nav {
    color: #94a3b8;
}

.nav div {
    margin: 12px 0;
    cursor: pointer;
}

.nav div:hover {
    color: #00f5ff;
}

/* =========================
   MAIN DASHBOARD
========================= */

.main {
    margin-left: 280px;
    padding: 30px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.status {
    background: rgba(34,197,94,0.2);
    color: #22c55e;
    padding: 6px 12px;
    border-radius: 20px;
}

/* =========================
   KPI CARDS
========================= */

.kpi {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,255,255,0.1);
    padding: 18px;
    border-radius: 14px;
    backdrop-filter: blur(20px);
}

.value {
    font-size: 26px;
    color: #00f5ff;
    font-weight: bold;
}

/* INPUT */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #1f2937;
    background: #0b1220;
    color: white;
}

/* BUTTON */
button {
    margin-top: 10px;
    padding: 12px;
    border: none;
    background: linear-gradient(90deg, #00f5ff, #3b82f6);
    color: black;
    font-weight: bold;
    cursor: pointer;
    border-radius: 10px;
}

canvas {
    margin-top: 20px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">DEPTHIQ</div>

<div class="nav">
<div>Dashboard</div>
<div>Prediction</div>
<div>Analytics</div>
<div>Model Health</div>
</div>

</div>

<div class="main">

<div class="header">
<h1>Drilling Intelligence Control Room</h1>
<div class="status">● SYSTEM ONLINE</div>
</div>

<!-- KPI -->
<div class="kpi">
<div class="card"><div>ROP Avg</div><div class="value" id="avg">--</div></div>
<div class="card"><div>ROP Cut</div><div class="value" id="cut">--</div></div>
<div class="card"><div>ROP Fast</div><div class="value" id="fast">--</div></div>
</div>

<!-- INPUT -->
<div class="card">

<div class="grid">
<input id="ad_rop_sp" placeholder="AD ROP SP">
<input id="ad_torque_sp" placeholder="Torque SP">
<input id="accum_trip_in" placeholder="Trip In">
<input id="datetime" type="datetime-local">
<input id="depth_of_cut" placeholder="Depth of Cut">
<input id="hook_load" placeholder="Hook Load">
<input id="total_gas" placeholder="Gas">
<input id="wc_bit_weight" placeholder="Bit Weight">
</div>

<button onclick="predict()">RUN PREDICTION</button>

</div>

<!-- CHARTS -->
<div class="card"><canvas id="bar"></canvas></div>
<div class="card"><canvas id="scatter"></canvas></div>

</div>

<script>

let last = [];
let bar, scatter;

/* HEALTH */
setInterval(async ()=>{
const r = await fetch("/health");
const d = await r.json();
},3000);

/* PREDICT */
async function predict(){

const data = {
ad_rop_sp:+ad_rop_sp.value,
ad_torque_sp:+ad_torque_sp.value,
accum_trip_in:+accum_trip_in.value,
datetime:new Date(datetime.value).getTime(),
depth_of_cut:+depth_of_cut.value,
hook_load:+hook_load.value,
total_gas:+total_gas.value,
wc_bit_weight:+wc_bit_weight.value
};

const res = await fetch("/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r = await res.json();

last = [r.ROP_Average,r.ROP_Cut_Unit,r.ROP_Fast];

avg.innerText = r.ROP_Average.toFixed(2);
cut.innerText = r.ROP_Cut_Unit.toFixed(2);
fast.innerText = r.ROP_Fast.toFixed(2);

/* BAR */
if(bar) bar.destroy();
bar = new Chart(document.getElementById("bar"),{
type:"bar",
data:{
labels:["Avg","Cut","Fast"],
datasets:[{data:last,backgroundColor:"#00f5ff"}]
}
});
}

</script>

</body>
</html>
