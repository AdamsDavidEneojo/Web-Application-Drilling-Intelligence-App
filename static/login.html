<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PIERCE Login</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background: radial-gradient(circle at top, #050816, #000);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:rgba(255,255,255,0.04);
border:1px solid rgba(0,245,255,0.2);
padding:40px;
border-radius:14px;
width:320px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid rgba(0,245,255,0.2);
background:#0b1220;
color:white;
}

button{
width:100%;
padding:12px;
background:linear-gradient(90deg,#00f5ff,#3b82f6);
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.error{color:red;font-size:12px;}
</style>
</head>

<body>

<div class="box">
<h2> PIERCE </h2>
<p>Drilling Intelligence Platform</p>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<div class="error" id="err"></div>
</div>

<script>

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="pierce123"){
localStorage.setItem("pierce_logged_in","true");
window.location.href="index.html";
}else{
document.getElementById("err").innerText="Invalid login";
}
}

window.onload=()=>{
if(localStorage.getItem("pierce_logged_in")){
window.location.href="index.html";
}
}

</script>

</body>
</html>
